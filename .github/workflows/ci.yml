name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EBAY_CLIENT_ID: ""
      EBAY_CLIENT_SECRET: ""
      EBAY_ACCESS_TOKEN: ""
      BRAVE_SEARCH_API_KEY: ""
      OPENAI_API_KEY: ""
      POSHMARK_PUBLIC_SEARCH: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Type check
        run: npm run typecheck
      - name: Provider recovery, identity, evidence and scoring tests
        run: npm test
      - name: Build
        run: npm run build
      - name: API smoke checks without provider credentials
        shell: bash
        run: |
          node scripts/run-framework.mjs dev > "$RUNNER_TEMP/clothing-finder-dev.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/api/status > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/clothing-finder-dev.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/clothing-finder-dev.log"
            exit 1
          fi
          npm run test:api
